<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
  body { width: 280px; margin: 0; padding: 16px; background: #fff; }
  h1 { font-size: 14px; color: #ff7a00; margin: 0 0 4px; }
  p { font-size: 12px; color: #666; margin: 0 0 12px; line-height: 1.4; }
  button { width: 100%; background: #ff7a00; color: white; border: 0; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  button:hover { background: #e56d00; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .license-panel { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
  .license-panel label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 6px; }
  .license-panel input { width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
  .license-status { font-size: 12px; line-height: 1.45; margin-top: 8px; color: #666; }
  .license-status.ok { color: #12805c; }
  .license-status.bad { color: #c62828; }
  .small { font-size: 11px; color: #999; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
  <h1>591 vs i智慧 自動比對</h1>
  <p>按下按鈕後會自動抓取兩邊資料、比對社區與總價，幾秒鐘後在新分頁顯示結果。</p>
  <button id="startBtn">🔍 開始自動比對</button>
  <div class="license-panel" id="licensePanel">
    <label for="licenseKey">授權序號</label>
    <input id="licenseKey" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off">
    <button id="verifyLicenseBtn" type="button">驗證授權</button>
    <div id="licenseStatus" class="license-status">請輸入授權序號後驗證。</div>
  </div>
  <div class="small">需先登入 i智慧 與 591 會員中心</div>
  <script src="popup.js"></script>
</body>
</html>
