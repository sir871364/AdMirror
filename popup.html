<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
  body { width: 320px; margin: 0; padding: 14px; background: #fff; color: #222; }
  h1 { font-size: 14px; color: #ff7a00; margin: 0 0 2px; user-select: none; }
  .license-expiry-info { display: none; margin: 0 0 10px; padding: 8px; border: 1px solid #b7dfd1; border-radius: 6px; background: #f0faf6; color: #12805c; font-size: 12px; text-align: center; white-space: pre-line; }
  .tag { display:inline-block; font-size:10px; color:#1565c0; background:#e3f2fd; border-radius:8px; padding:1px 6px; margin-bottom:10px; }
  button { width: 100%; border: 0; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 7px; }
  .primary { background: #ff7a00; color: #fff; }
  .primary:hover { background: #e56d00; }
  .sec { background: #eef1f4; color: #333; }
  .sec:hover { background: #e2e6ea; }
  .danger { background: #c62828; color: #fff; }
  button:disabled { background: #ccc; color: #777; cursor: not-allowed; }
  .status { font-size: 12px; line-height: 1.5; margin: 8px 0; padding: 8px; background: #f5f5f7; border-radius: 6px; white-space: pre-line; min-height: 34px; }
  .err { color: #c62828; font-size: 12px; line-height: 1.5; margin: 6px 0; white-space: pre-line; }
  .bar { background:#e0e0e0; border-radius:5px; height:8px; overflow:hidden; margin:6px 0 8px; display:none; }
  .fill { background: linear-gradient(90deg,#ff7a00,#ffa040); height:100%; width:0%; transition: width .3s ease; }
  .hint { font-size: 11px; color: #777; line-height: 1.5; margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
  .diag { font-size: 10px; color: #999; word-break: break-all; margin-top: 6px; white-space: pre-line; cursor: pointer; }
  #diagDetail { cursor: auto; color: #aaa; }
  hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }
  .license-panel { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; text-align: center; }
  .qr-box { width: 210px; height: 210px; margin: 10px auto; background:#fff; border:1px solid #eee; border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .qr-box img { width: 200px; height: 200px; display:block; }
  .timer { font-size: 20px; color:#0e748c; font-weight:bold; margin-top:6px; }
  .install-id { font-size:10px; color:#999; word-break:break-all; margin-top:6px; }
  .license-status { font-size: 12px; line-height: 1.45; margin-top: 8px; color: #666; white-space: pre-line; }
  .license-status.ok { color: #12805c; }
  .license-status.bad { color: #c62828; }
  .opt { display:flex; align-items:center; gap:6px; font-size:11px; color:#555; margin:-2px 0 8px; cursor:pointer; }
  .opt input { margin:0; cursor:pointer; }
</style>
</head>
<body>
  <h1 id="appTitle">591 × i智慧 比對</h1>
  <div class="tag" id="versionTag">AdMirror</div>
  <div id="licenseExpiryInfo" class="license-expiry-info" aria-live="polite"></div>

  <button id="btnAuto" class="primary">🚀 自動擷取並比對</button>

  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <div class="status" id="status">請先切到 i智慧「關注物件」分頁。</div>
  <div class="err" id="err"></div>

  <hr>
  <button id="btnManualStart" class="sec">🖐 手動擷取（自己翻頁）</button>
  <button id="btnManualStop" class="sec" style="display:none">✅ 完成擷取</button>
  <button id="btnCompare" class="sec">📊 只比對（用上次擷取的資料）</button>
  <button id="btnAbort" class="danger" style="display:none">■ 停止</button>

  <div class="license-panel" id="licensePanel">
    <div class="qr-box"><img id="licenseQr" alt="授權 QR Code"></div>
    <div class="timer" id="qrTimer">05:00</div>
    <button id="refreshQrBtn" class="sec" type="button">重新產生 QR Code</button>
    <div id="licenseStatus" class="license-status"></div>
    <div id="installIdText" class="install-id"></div>
  </div>

  <div class="hint">
    自動模式會重新載入 i智慧 分頁，再自己翻頁把每一頁的資料收下來。<br>
    若自動翻頁找不到「下一頁 ›」，改用「手動擷取」：按下後自己翻頁，翻完按「完成擷取」。
  </div>
  <div class="diag" id="diag"></div>
  <div class="diag" id="diagDetail" style="display:none"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
