<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>591 vs i智慧 比對結果</title>
<style>
  * { box-sizing: border-box; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
  body { margin: 0; padding: 24px; background: #f5f5f7; color: #222; }
  h1 { color: #ff7a00; margin: 0 0 6px; font-size: 24px; }
  .sub { color: #666; margin-bottom: 20px; font-size: 14px; }

  .progress-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); text-align: center; max-width: 600px; margin: 40px auto; }
  .progress-card h2 { color: #ff7a00; margin: 0 0 16px; }
  .progress-card .msg { font-size: 16px; color: #444; margin-bottom: 20px; min-height: 24px; }
  .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ff7a00; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .error { background: #ffebee; color: #c62828; padding: 16px; border-radius: 6px; margin-top: 16px; }
  .error h3 { margin: 0 0 8px; }
  .retry { background: #ff7a00; color: white; border: 0; padding: 10px 24px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 12px; }

  .summary { background: white; padding: 20px; border-radius: 10px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stats { display: flex; gap: 16px; margin-top: 14px; }
  .stat { flex: 1; text-align: center; padding: 18px; border-radius: 8px; }
  .stat .num { font-size: 38px; font-weight: bold; line-height: 1; }
  .stat .lbl { font-size: 13px; margin-top: 6px; }
  .stat.ok { background: #e8f5e9; color: #2e7d32; }
  .stat.warn { background: #fff3e0; color: #ef6c00; }
  .stat.bad { background: #ffebee; color: #c62828; }
  .stat.info { background: #e3f2fd; color: #1565c0; }

  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th { background: #ff7a00; color: white; padding: 12px 10px; text-align: left; font-size: 13px; }
  td { padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: top; }
  tr:hover { background: #fafafa; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .badge.ok { background: #c8e6c9; color: #2e7d32; }
  .badge.warn { background: #ffe0b2; color: #ef6c00; }
  .badge.bad { background: #ffcdd2; color: #c62828; }
  .badge.info { background: #bbdefb; color: #1565c0; }

  .actions { margin: 16px 0; }
  .actions button { background: white; border: 1px solid #ddd; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 8px; font-size: 13px; }
  .actions button.primary { background: #ff7a00; color: white; border-color: #ff7a00; }
  .actions button:hover { opacity: 0.85; }

  /* === 結果頁的小提醒列 === */
  .reminder-bar { background: #fff8e1; border-left: 4px solid #ff9800; padding: 10px 16px; margin-bottom: 14px; border-radius: 4px; font-size: 13px; color: #6d4c00; display: flex; align-items: center; gap: 8px; }
  .reminder-bar a { color: #ef6c00; cursor: pointer; text-decoration: underline; margin-left: auto; font-weight: bold; }

</style>
</head>
<body>

<h1>591 廣告 vs i智慧 自動比對</h1>
<div class="sub">本工具會自動抓取兩邊資料並比對社區+總價</div>

<!-- 比對進度 -->
<div id="progress" class="progress-card">
  <div class="spinner"></div>
  <h2>正在比對中…</h2>
  <div class="msg" id="statusMsg">準備開始…</div>
</div>

<!-- 比對結果 -->
<div id="output" style="display:none;"></div>

<script src="result.js"></script>
</body>
</html>
