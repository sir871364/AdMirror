<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #0e748c 0%, #22c5d6 100%);
    display: flex; align-items: center; justify-content: center; gap: 64px;
  }
  .copy { width: 560px; color: #fff; }
  .copy h1 { font-size: 44px; line-height: 1.25; letter-spacing: -0.5px; margin-bottom: 18px; }
  .copy p { font-size: 19px; line-height: 1.7; opacity: .95; margin-bottom: 26px; }
  .points { list-style: none; }
  .points li {
    font-size: 17px; line-height: 1.6; margin-bottom: 13px;
    padding-left: 32px; position: relative;
  }
  .points li::before {
    content: '✓'; position: absolute; left: 0; top: -1px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,.22); color: #fff;
    font-size: 13px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
  }
  .frame {
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.35);
  }
  .bar { height: 34px; background: #e9edf1; display: flex; align-items: center; padding: 0 13px; gap: 7px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  iframe { width: 320px; height: 400px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <h1>591 廣告 vs i智慧<br>一鍵找出該改價、該下架的物件</h1>
    <p>比對你自己在 591 會員中心的上架廣告，與 i智慧 的關注物件，列出價格不一致與需要處理的項目。</p>
    <ul class="points">
      <li>自動擷取兩邊清單，逐筆對照社區、價格、坪數、樓層</li>
      <li>分成完美匹配／價格不一致／需人工確認／應下架四類</li>
      <li>i智慧 端不注入腳本、不主動呼叫 API</li>
      <li>資料只留在你自己的電腦，不會上傳</li>
    </ul>
  </div>
  <div class="frame">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
    </div>
    <iframe src="stub-popup.html"></iframe>
  </div>
</body>
</html>
